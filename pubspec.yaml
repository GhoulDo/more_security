name: more_security
description: "Aplicación para analizar la seguridad del dispositivo móvil"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Paquetes para UI y diseño
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.10+1
  percent_indicator: ^4.2.3
  lottie: ^3.1.0
  
  # Paquetes para lógica y funcionalidad
  permission_handler: ^11.3.0
  device_info_plus: ^9.1.2
  path_provider: ^2.1.2
  flutter_file_dialog: ^3.0.2
  installed_apps: ^1.4.0
  package_info_plus: ^8.3.0
  
  # Paquetes para estado y gestión
  provider: ^6.1.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  
  # Descomentamos las fuentes ya que están instaladas
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
